name: flutter_architecture_templates
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  #网络
  retrofit: ^4.4.2
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  #状态管理
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  flutter_riverpod: ^2.6.1

  #设备信息
  device_info_plus: ^11.2.2

  #应用版本信息
  package_info_plus: ^8.2.0

  #日志
  logger: ^2.5.0

  #图片加载
  cached_network_image: ^3.4.1

  #URL相关，如：打开链接
  #https://pub.dev/packages/url_launcher
  url_launcher: ^6.3.1

  #本地存储文件的路径相关
  #https://pub.dev/packages/path_provider
  path_provider: ^2.1.5

  #Dart常用工具类库。包含日期，正则，倒计时，时间轴等工具类
  common_utils: ^2.1.0

  #路由
  go_router: ^14.7.2

  #Dart数据类自动生成的注解
  freezed_annotation: ^2.4.4

  #瀑布流布局相关
  #https://pub.dev/packages/flutter_staggered_animations
  flutter_staggered_animations: ^1.1.1
  #https://pub.dev/packages/flutter_staggered_grid_view
  flutter_staggered_grid_view: ^0.7.0

  #弹框组件
  flutter_smart_dialog: ^4.9.8+5

  #OnlyForTest 网络图片测试素材
  #https://unsplash.com/oauth/applications/534840
  #https://pub.dev/packages/unsplash_client
  unsplash_client: ^2.2.0

  # 代理
  native_flutter_proxy: ^0.1.15

  # Tab 懒加载
  flutter_lazy_indexed_stack: ^0.0.6

  #下拉刷新
  easy_refresh: ^3.4.0

  # 集合工具类
  collection: ^1.19.1

  # google 提供的Json注解
  json_annotation: ^4.9.0

  # 本地存储
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  shared_preferences: ^2.3.2

  # 图片选择
  image_picker: ^1.1.2

  # 相机
  camera: ^0.11.1

dependency_overrides:
  # 集合工具类
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  #Flutter源代码静态分析器
  flutter_lints: ^5.0.0

  #Flutter代码自动生成工具
  build_runner: ^2.4.14

#  #Flutter资源文件管理类自动生成工具
#  flutter_gen_runner: ^5.8.0

  #RiverPod自动生成辅助器
  custom_lint: ^0.7.2
  riverpod_lint: ^2.6.4

  #Retrofit代码自动生成工具
  retrofit_generator: ^9.1.7

  #RiverPod代码自动生成工具
  riverpod_generator: ^2.6.4

  #GoRouter代码自动生成工具
  go_router_builder: ^2.7.5

  #Dart数据类与JSON互相转化类的自动生成工具
  #https://pub.dev/packages/json_serializable
  json_serializable: ^6.9.3
  #https://pub.dev/packages/freezed
  freezed: ^2.5.8

  #drift: 代码自动生成
  drift_dev: ^2.24.0

  #更换项目包名工具
  #https://pub.dev/packages/change_app_package_name
  change_app_package_name: ^1.3.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/


